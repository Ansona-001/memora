<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="outerLeft" x1="8" y1="24" x2="40" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc2d1"/>
      <stop offset="0.55" stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="outerRight" x1="92" y1="24" x2="60" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb3c7"/>
      <stop offset="0.55" stop-color="#f4436c"/>
      <stop offset="1" stop-color="#b91c46"/>
    </linearGradient>
    <linearGradient id="inner" x1="34" y1="54" x2="66" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4d6d"/>
      <stop offset="1" stop-color="#c81e4f"/>
    </linearGradient>
  </defs>

  <!-- Outer heart, drawn as two open strokes (deliberate gap at the bottom
       center for the inner heart to nest into) with a shared dip at the
       top forming a subtle "M". Thick rounded strokes so the shape holds
       up at favicon sizes (16-48px), unlike a thin outline would. -->
  <path
    d="M50 38
       C44 26 32 16 20 18
       C8 20 3 32 8 44
       C12 54 22 64 36 74"
    stroke="url(#outerLeft)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M50 38
       C56 26 68 16 80 18
       C92 20 97 32 92 44
       C88 54 78 64 64 74"
    stroke="url(#outerRight)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner solid heart, nested in the gap. -->
  <path
    d="M50 60
       C50 50 41 45 34 49
       C28 52 26 60 30 67
       C34 74 42 80 50 86
       C58 80 66 74 70 67
       C74 60 72 52 66 49
       C59 45 50 50 50 60 Z"
    fill="url(#inner)"
  />
</svg>
